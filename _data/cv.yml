- title: Research Experience
  type: time_table
  contents:
    - title: Research Fellow, INNOVATION Laboratory (Tissue Engineering & Biomaterials Evaluation)
      institution: CAAD (Translational Research Centre for Autoimmune and Allergic Diseases), Novara, Italy
      year: 2025 - Present
      description:
        - Contribute to R&D projects and laboratory testing services.
        - "CeramTec GmbH: Assessed cell viability, adhesion, proliferation and osteogenic potential in response to polyaryletherketone (PAEK) materials. Experimental models: 2D cultures of human bone marrow-derived mesenchymal stem cells (hBM-MSCs) and human osteosarcoma cells (U2OS)."
        - "Tiss’You srl: Evaluated cellular responses to low-molecular-weight hydrolyzed collagen peptides, assessing regenerative potential, anti-scarring activity, cytoskeletal organization and cellular mechanobiology. Experimental models: 2D cultures of human dermal fibroblasts (hTERT-HDFa) and human keratinocytes (HaCaT); 3D reconstructed human epidermis (RHE)."
        - "Sanitpharma srl: Analyzed particle size and elemental composition to assess size-based separation performance and potential particle release from processing filters."
    - title: Research Intern, Regenerative Anatomy Laboratory
      institution: University of Piemonte Orientale, Novara, Italy
      year: 2023 - 2025
      description:
        - Conducted physicochemical, biological and antibacterial evaluations of titanium dental implant surfaces modified with copper- and zinc-doped PEO coatings.
        - "Physicochemical characterization: coating topography, surface elemental composition, wettability and surface energy."
        - "Biological evaluation: cytocompatibility, cell morphology, focal adhesions, cytoskeletal organization, inflammatory responses, extracellular collagen deposition and matrix mineralization. Experimental models: 2D cultures of mouse preosteoblasts (MC3T3-E1), normal human dermal fibroblasts (NHDF-Ad), human gingival fibroblasts (HGF-1) and human osteoblasts (HOB)."
        - "Antibacterial evaluation: bacterial metabolic activity, viable counts, membrane integrity and biofilm morphology. Experimental models: sessile cultures of S. epidermidis, S. aureus and A. actinomycetemcomitans."
    - title: Erasmus+ Research Trainee, Department of Biomaterials
      institution: University of Oslo, Oslo, Norway
      year: 2024
      description:
        - Investigated multifunctional tannic acid nanocoatings for bone-anchored implant surfaces with reduced infection risk.
        - "Surface modification: prepared tannic acid-coated titanium substrates."
        - "Antibacterial evaluation: activity of UV-inactivated L. crispatus biofilms against S. epidermidis on saliva-conditioned, tannic acid-coated titanium surfaces."

